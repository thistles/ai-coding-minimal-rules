<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Coding Rules — English Figures (render &amp; export)</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 32px 60px;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: #f6f8fa; color: #1f2328;
  }
  header { max-width: 1040px; margin: 0 auto 20px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  header p { margin: 0; color: #57606a; font-size: 14px; }
  .toolbar {
    max-width: 1040px; margin: 0 auto 24px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: #fff; border: 1px solid #d0d7de; border-radius: 10px; padding: 12px 16px;
  }
  .toolbar label { font-size: 13px; color: #57606a; display: flex; align-items: center; gap: 6px; }
  select, button {
    font: inherit; font-size: 13px; border-radius: 6px; cursor: pointer;
  }
  select { border: 1px solid #d0d7de; padding: 4px 8px; background: #fff; }
  button {
    border: 1px solid rgba(31,35,40,0.15); background: #f6f8fa; padding: 6px 14px;
  }
  button:hover { background: #eef1f4; }
  button.primary { background: #1f883d; color: #fff; border-color: #1f883d; }
  button.primary:hover { background: #1a7f37; }
  .fig-card {
    max-width: 1040px; margin: 0 auto 28px; background: #fff;
    border: 1px solid #d0d7de; border-radius: 10px; overflow: hidden;
  }
  .fig-card h2 {
    font-size: 15px; margin: 0; padding: 12px 16px; border-bottom: 1px solid #d0d7de;
    display: flex; justify-content: space-between; align-items: center;
  }
  .fig-card h2 .actions { display: flex; gap: 8px; }
  .fig-card h2 .actions button { padding: 3px 10px; font-size: 12px; }
  .fig-body { padding: 18px; display: flex; justify-content: center; }
  .fig-body svg { max-width: 100%; height: auto; }
  .status { max-width: 1040px; margin: 0 auto; font-size: 13px; color: #1a7f37; min-height: 18px; }
</style>

<body>

<header>
  <h1>AI Coding Rules — English figures</h1>
  <p>Live-rendered from the SVG sources in <code>assets/</code>. Pick a scale, then export either figure as SVG or PNG (the PNG export re-draws the vector at your chosen scale, so it stays sharp).</p>
</header>

<div class="toolbar">
  <label>Export scale
    <select id="scale">
      <option value="1">1x (960/1000 px)</option>
      <option value="2" selected>2x (retina)</option>
      <option value="3">3x (print)</option>
      <option value="4">4x</option>
    </select>
  </label>
  <button class="primary" onclick="exportFig('fig1','png')">Export Fig 1 as PNG</button>
  <button class="primary" onclick="exportFig('fig2','png')">Export Fig 2 as PNG</button>
  <button onclick="exportFig('fig1','svg')">Export Fig 1 as SVG</button>
  <button onclick="exportFig('fig2','svg')">Export Fig 2 as SVG</button>
  <button onclick="renderAll()">Re-render</button>
</div>

<div class="fig-card">
  <h2>Fig 1 — The four mechanisms
    <span class="actions">
      <button onclick="downloadFile('fig1-four-mechanisms-en.svg', svgText('fig1'), 'image/svg+xml')">SVG</button>
      <button onclick="exportFig('fig1','png')">PNG</button>
    </span>
  </h2>
  <div class="fig-body" id="fig1"></div>
</div>

<div class="fig-card">
  <h2>Fig 2 — The core loop
    <span class="actions">
      <button onclick="downloadFile('fig2-core-loop-en.svg', svgText('fig2'), 'image/svg+xml')">SVG</button>
      <button onclick="exportFig('fig2','png')">PNG</button>
    </span>
  </h2>
  <div class="fig-body" id="fig2"></div>
</div>

<div class="status" id="status"></div>

const NAMES = { fig1: 'fig1-four-mechanisms-en.svg', fig2: 'fig2-core-loop-en.svg' };

async function renderAll() {
  for (const key of ['fig1', 'fig2']) {
    const host = document.getElementById(key);
    let svg = null;
    try {
      const res = await fetch(NAMES[key], { cache: 'no-store' });
      if (res.ok) svg = await res.text();
    } catch (e) { /* file:// fallback */ }
    if (!svg || !svg.includes('<svg')) svg = FALLBACKS[key];
    host.innerHTML = svg;
  }
  setStatus('Rendered.');
}

function svgEl(key) {
  const svg = document.getElementById(key).querySelector('svg');
  if (!svg) throw new Error('figure not rendered');
  return svg;
}
function svgText(key) {
  const clone = svgEl(key).cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
}

function exportFig(key, type) {
  const scale = parseFloat(document.getElementById('scale').value) || 2;
  const svg = svgEl(key);
  const w = parseFloat(svg.getAttribute('width')), h = parseFloat(svg.getAttribute('height'));
  const base = NAMES[key].replace(/\.svg$/, '');

  if (type === 'svg') {
    downloadFile(base + '.svg', svgText(key), 'image/svg+xml');
    setStatus(base + '.svg downloaded.');
    return;
  }
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob => {
      downloadFile(base + '@' + scale + 'x.png', blob, 'image/png');
      setStatus(base + ' @' + scale + 'x downloaded (' + canvas.width + '×' + canvas.height + ').');
    }, 'image/png');
  };
  img.onerror = () => setStatus('PNG export failed — try serving the folder over http.');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText(key));
}

function downloadFile(name, data, mime) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

renderAll();
</script>
