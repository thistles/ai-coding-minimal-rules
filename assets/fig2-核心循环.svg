<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="580" fill="#ffffff"/>

  <text x="48" y="50" font-size="26" font-weight="600" fill="#1f2328">一条循环，四步</text>
  <text x="48" y="80" font-size="15" fill="#6b7280">四个机制对应四个根因，所以只够四步。步骤越多，遵守率越低。</text>

  <!-- 三步主循环 -->
  <rect x="48" y="128" width="248" height="118" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="172" y="156" font-size="17" font-weight="600" fill="#0C447C" text-anchor="middle">① align　锁定</text>
  <text x="172" y="182" font-size="13" fill="#185FA5" text-anchor="middle">一次一问，穷尽决策树</text>
  <text x="172" y="204" font-size="13" fill="#185FA5" text-anchor="middle">写 spec · 定红线 · 记 ADR</text>
  <text x="172" y="226" font-size="12" fill="#185FA5" text-anchor="middle">治根因 1：真相只在对话里</text>

  <rect x="356" y="128" width="248" height="118" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="480" y="156" font-size="17" font-weight="600" fill="#085041" text-anchor="middle">② build　造</text>
  <text x="480" y="182" font-size="13" fill="#0F6E56" text-anchor="middle">选缝 → 红 → 绿 → 下一片</text>
  <text x="480" y="204" font-size="13" fill="#0F6E56" text-anchor="middle">竖切片 · 一次改动 ≤ 5 文件</text>
  <text x="480" y="226" font-size="12" fill="#0F6E56" text-anchor="middle">治根因 2、3：无边界、无回归网</text>

  <rect x="664" y="128" width="248" height="118" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="788" y="156" font-size="17" font-weight="600" fill="#3C3489" text-anchor="middle">③ audit　审</text>
  <text x="788" y="182" font-size="13" fill="#534AB7" text-anchor="middle">规范轴 + 规格轴，分开报</text>
  <text x="788" y="204" font-size="13" fill="#534AB7" text-anchor="middle">不合并、不跨轴排序</text>
  <text x="788" y="226" font-size="12" fill="#534AB7" text-anchor="middle">让范围蔓延变得可见</text>

  <!-- 箭头 1->2 -->
  <path d="M302 187L348 187" fill="none" stroke="#888780" stroke-width="2.5" marker-end="url(#arr2)"/>
  <!-- 箭头 2->3 -->
  <path d="M610 187 L656 187" fill="none" stroke="#888780" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- 回环3->1：走下方，避免压住标题 -->
  <path d="M916 187L946 187 Q966 187 966 207 L966 268 Q966 288 946 288 L54 288 Q34 288 34 268 L34 207 Q34 187 54 187 L42 187" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr2)"/>
  <text x="500" y="310" font-size="13" fill="#6b7280" text-anchor="middle">下一轮迭代：带着新事实回到 align，重新锁定</text>

  <!-- rescue -->
  <rect x="248" y="336" width="464" height="108" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="480" y="364" font-size="17" font-weight="600" fill="#791F1F" text-anchor="middle">④ rescue　救（随时可插入）</text>
  <text x="480" y="390" font-size="13" fill="#A32D2D" text-anchor="middle">先建一个能变红的反馈回路，再谈原因</text>
  <text x="480" y="412" font-size="13" fill="#A32D2D" text-anchor="middle">回路能红 → 最小化 → 列 3–5 个可证伪假设 → 埋点 → 修</text>
  <text x="480" y="432" font-size="12" fill="#A32D2D" text-anchor="middle">治根因 4：真因写进提交信息，下一个排障的人不用重走</text>

  <path d="M420 250 L420 330" fill="none" stroke="#F09595" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
  <path d="M540 250 L540 330" fill="none" stroke="#F09595" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr2)"/>

  <!-- 底部：四份文件 -->
  <rect x="48" y="482" width="864" height="86" rx="10" fill="#F8FAFC" stroke="#D3D1C7" stroke-width="1.5"/>
  <text x="72" y="510" font-size="14" font-weight="600" fill="#2C2C2A">四份文件，没有第五份</text>
  <text x="72" y="536" font-size="13" fill="#444441">AGENTS.md（项目宪法）　·　docs/spec.md（本版规格）　·　docs/adr/（决策记录）　·　测试即回归网</text>
  <text x="72" y="558" font-size="12" fill="#6b7280">文件数量是学习成本的主要来源。进展日志、架构全景图、README 摘要——一律不写。</text>

  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>